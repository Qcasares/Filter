<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hemisphere</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px 16px;
      font-size: 14px;
    }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #b8860b; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
    .muted { color: #666; font-size: 12px; }
    input[type="range"] { width: 100%; }
    .count { font-weight: 600; }
    .site { font-size: 12px; word-break: break-all; color: #444; }
    label.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    label.switch input { display: none; }
    .slider-toggle { position: absolute; inset: 0; background: #ccc; border-radius: 22px; transition: .2s; }
    .slider-toggle:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider-toggle { background: #b8860b; }
    input:checked + .slider-toggle:before { transform: translateX(18px); }
    a { color: #8a6d1a; }
  </style>
</head>
<body>
  <h1><span class="dot"></span> Hemisphere</h1>

  <div class="row">
    <span>Enabled</span>
    <label class="switch"><input type="checkbox" id="enabled" /><span class="slider-toggle"></span></label>
  </div>

  <div class="row">
    <span>Demoted on this page</span>
    <span class="count" id="count">0</span>
  </div>

  <div>
    <div class="row" style="margin-bottom:4px;">
      <span>Threshold</span>
      <span id="thresholdValue" class="muted">70</span>
    </div>
    <input type="range" id="threshold" min="0" max="100" step="5" />
    <div class="muted">Higher hides less. Lower hides more.</div>
  </div>

  <div class="row">
    <span class="site" id="host">this site</span>
    <label class="switch"><input type="checkbox" id="siteEnabled" /><span class="slider-toggle"></span></label>
  </div>

  <div class="muted"><a href="#" id="openOptions">Full settings</a></div>

  <script src="./popup.js"></script>
</body>
</html>
